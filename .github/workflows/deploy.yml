name: Continuous Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          composer install --no-dev --optimize-autoloader

      - name: Run Database Migrations & Optimization
        run: |
          php artisan migrate --force
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

      - name: Reload PHP-FPM / Application
        run: |
          # Pilih salah satu sesuai dengan setup server Anda:
          # Jika menggunakan PHP-FPM (misal php8.2-fpm / php8.3-fpm):
          sudo systemctl reload php8.3-fpm || sudo systemctl reload php-fpm || true

          # ATAU jika menggunakan Laravel Queue Worker:
          php artisan queue:restart || true
